[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Hashing in an unoptimised build is 20-50x slower, which makes dev runs on
# real footage useless. Keep our own code debuggable, optimise dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
