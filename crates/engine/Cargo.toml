[package]
name = "backup-engine"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = "0.4"
filetime = "0.2"
fs4 = "0.13"
gethostname = "1"
kamadak-exif = "0.6"
md-5 = "0.10"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
